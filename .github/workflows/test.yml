name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # react/react-dom needed by client bundle tests; skipped when absent
      - run: npm install --no-save react react-dom
      - name: Host plugin tests
        run: node tests/balance-display.test.mjs
      - name: Client bundle tests
        run: node tests/client-bundle.test.mjs
